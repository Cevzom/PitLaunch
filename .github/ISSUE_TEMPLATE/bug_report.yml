name: Bug report
description: Report a reproducible PitLaunch problem with the hardware details needed to investigate it.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve PitLaunch. Please avoid posting raw `profiles.json` files or private data.
  - type: input
    id: version
    attributes:
      label: PitLaunch version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Press Win+R, run `winver`, and copy the version and OS build.
      placeholder: "Windows 11 24H2, OS build 26100.x"
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      placeholder: "NVIDIA RTX 4070, driver 5xx.xx"
    validations:
      required: true
  - type: textarea
    id: monitors
    attributes:
      label: Monitor setup
      description: List each display, connection type, resolution/refresh rate, and whether a dock, Surround, Eyefinity, cloning, or adapter is involved.
      placeholder: "Desk: two DisplayPort monitors; rig: one HDMI ultrawide…"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start on Desk
        2. Switch to Sim Racing
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
      placeholder: "Expected… Actual…"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: Paste only the lines around the failure from `%APPDATA%\PitLaunch\pitlaunch.log`, or attach the privacy-sanitized support bundle.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, email addresses, usernames, and other private data.
          required: true
